name: Build polykrom-cli

# Builds WCKDai/polykrom's headless CLI and uploads a Windows binary.
# Local builds are blocked by an endpoint AV filter that quarantines freshly
# linked build-script binaries (os error 225 / ERROR_VIRUS_INFECTED), so the
# binary is produced on a clean runner and downloaded.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: polykrom ref to build
        required: false
        default: main
  push:
    paths:
      - '.github/workflows/build-polykrom-cli.yml'

jobs:
  windows-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out polykrom
        uses: actions/checkout@v4
        with:
          repository: WCKDai/polykrom
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: polykrom

      - name: Install Rust and the Windows target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: polykrom -> target
          key: win-gnu

      - name: Build polykrom-cli
        working-directory: polykrom
        run: cargo build --release --target x86_64-pc-windows-gnu -p solidcraft-cli --bin polykrom-cli

      - name: Report binary
        working-directory: polykrom
        run: |
          exe=target/x86_64-pc-windows-gnu/release/polykrom-cli.exe
          test -f "$exe" || { echo "polykrom-cli.exe missing"; exit 1; }
          ls -lh "$exe"
          file "$exe"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: polykrom-cli-windows
          path: polykrom/target/x86_64-pc-windows-gnu/release/polykrom-cli.exe
          retention-days: 7
